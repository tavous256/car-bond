<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Car Bond</title>
<meta name="description" content="Buy and sell cars in Uganda, person to person.">
<meta name="theme-color" content="#1d3b8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Bond">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --ink:#14203a; --muted:#5d6782; --line:#dde2ee;
  --brand:#1d3b8f; --brand-ink:#ffffff; --sun:#f5b301; --sun-ink:#2a1d00; --sun-soft:#fff3cf;
  --ok:#1f8a4c; --ok-soft:#e2f4ea; --warn:#b4361f; --warn-soft:#fbe6e1;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 6px 20px rgba(20,32,58,.07);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1324; --surface:#161e35; --ink:#eef1fa; --muted:#9aa4c2; --line:#26304d;
  --brand:#1d3b8f; --brand-ink:#ffffff; --sun:#ffc533; --sun-ink:#231800; --sun-soft:#3a2f0e;
  --ok:#5cd18f; --ok-soft:#14321f; --warn:#ff8f78; --warn-soft:#3a1a14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:14px;display:grid;gap:12px}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:13px;flex:none;background:#fff}
.brandrow h1{font-size:27px;font-weight:800;line-height:1.1}
.brandrow p{margin:0;font-size:14.5px;opacity:.9}
.brandrow .grow{flex:1;min-width:0}
.install{border:0;background:var(--sun);color:var(--sun-ink);font-weight:700;border-radius:999px;padding:10px 16px;cursor:pointer;flex:none;font-size:15px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border-radius:999px;padding:0 18px;height:54px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;height:100%;font-size:17px}
.search svg{flex:none;opacity:.6;width:22px;height:22px}

.filters{display:flex;gap:10px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px;cursor:pointer;min-height:46px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:12px;color:var(--muted);font-size:16px;flex-wrap:wrap}
.toolbar select{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-block:6px 24px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;position:relative}
.ph{aspect-ratio:4/3;background:linear-gradient(160deg,var(--line),var(--bg));display:grid;place-items:center;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:46%;color:var(--muted);opacity:.55}
.cbody{padding:14px 16px 16px;display:grid;gap:5px;min-width:0}
.price{font-family:var(--display);font-weight:800;font-size:25px}
.price small{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);margin-right:4px}
.title{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:15.5px;display:flex;flex-wrap:wrap;gap:4px 12px}
.cta-line{color:var(--brand);font-weight:700;font-size:15.5px;padding-top:4px}
@media (prefers-color-scheme:dark){.cta-line{color:var(--sun)}}
.badge{position:absolute;top:12px;left:12px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 11px;border-radius:999px}
.badge.sold{background:var(--warn-soft);color:var(--warn)}
.badge.ex{background:var(--sun);color:var(--sun-ink)}
.card.is-sold{opacity:.62}
.fav{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;color:#14203a}
.fav[aria-pressed="true"]{color:#d6336c}
.fav svg{width:24px;height:24px}
.fav[aria-pressed="true"] svg{fill:currentColor}

.empty{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:grid;gap:16px;margin-block:12px 24px}
.empty h2{font-size:23px}
.empty p{margin:0;color:var(--muted);max-width:60ch;font-size:16.5px}
.note{font-size:15.5px;color:var(--ink);padding:12px 14px;border-radius:12px;background:var(--sun-soft);margin:0}

/* welcome */
.hello{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px 20px;display:grid;gap:18px;margin-block:16px 8px}
.hero-logo{background:#fff;border-radius:16px;display:grid;place-items:center;padding:10px}
.hero-logo img{width:min(100%,280px);height:auto;display:block}
.hello h2{font-size:27px;font-weight:800}
.hello>p{margin:0;color:var(--muted);font-size:17px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:0;border-radius:18px;padding:18px 14px;display:grid;justify-items:start;gap:8px;text-align:left;cursor:pointer;min-height:132px}
.choice svg{width:34px;height:34px}
.choice strong{font-family:var(--display);font-size:21px;line-height:1.15}
.choice span{font-size:14.5px;opacity:.85;line-height:1.3}
.choice.buy{background:var(--brand);color:#fff}
.choice.sell{background:var(--sun);color:var(--sun-ink)}
.how{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:how}
.how li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;counter-increment:how;font-size:16.5px}
.how li::before{content:counter(how);width:38px;height:38px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.how b{display:block}
.how small{color:var(--muted);font-size:15px}
.sellband{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sun-soft);border-radius:16px;padding:14px 16px;margin-top:16px;flex-wrap:wrap}
.sellband p{margin:0;font-weight:700;font-size:16.5px}

.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:54px}
.btn.primary{background:var(--sun);color:var(--sun-ink)}
.btn.brand{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.wa{background:#1fa855;color:#fff}
.btn.wide{width:100%}
.btn.small{min-height:46px;padding:10px 16px;font-size:16px}
.btn:disabled{opacity:.55;cursor:default}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:grid;justify-items:center;gap:3px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:28px;height:28px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
@media (prefers-color-scheme:dark){nav.tabs button[aria-current="page"]{color:var(--sun)}}
nav.tabs .plus{width:54px;height:34px;border-radius:999px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}

.sec-head{padding-block:22px 6px;display:grid;gap:6px}
.sec-head h2{font-size:29px;font-weight:800}
.sec-head p{margin:0;color:var(--muted);font-size:16.5px}

/* sell wizard */
.wiz{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:grid;gap:20px;margin-block:14px 28px}
.prog{display:grid;gap:8px}
.prog .lbl{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
.wiz h3{font-size:26px;font-weight:800}
.wiz .sub{margin:-12px 0 0;color:var(--muted);font-size:16.5px}
.q{display:grid;gap:10px}
.q>.ql{font-weight:800;font-size:18px}
.q>.ql small{font-weight:500;color:var(--muted);font-size:15px;margin-left:6px}
.picks{display:flex;flex-wrap:wrap;gap:10px}
.pick{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 16px;font-weight:700;font-size:17px;cursor:pointer;min-height:52px}
.pick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.inp{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;width:100%;min-width:0;font-size:18px}
.inp:focus{border-color:var(--brand);outline:none}
textarea.inp{min-height:120px;resize:vertical}
.big-money{font-family:var(--display);font-size:30px;font-weight:800}
.say{font-size:17px;color:var(--ok);font-weight:700;min-height:1.5em}
.photo-add{border:3px dashed var(--line);background:var(--bg);border-radius:18px;padding:30px 16px;display:grid;justify-items:center;gap:8px;cursor:pointer;text-align:center}
.photo-add svg{width:48px;height:48px;color:var(--brand)}
@media (prefers-color-scheme:dark){.photo-add svg{color:var(--sun)}}
.photo-add strong{font-size:19px}
.photo-add span{color:var(--muted);font-size:15px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.thumb .cover{position:absolute;left:4px;bottom:4px;background:var(--sun);color:var(--sun-ink);font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px}
.navrow{display:grid;grid-template-columns:auto 1fr;gap:10px}
.navrow.single{grid-template-columns:1fr}
.err{color:var(--warn);font-weight:700;font-size:16px;min-height:1.4em;margin:0}
.review{display:grid;gap:0;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.rv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv div{min-width:0}
.rv dt{font-size:14px;color:var(--muted);font-weight:700}
.rv dd{margin:0;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.rv button{border:0;background:none;color:var(--brand);font-weight:800;font-size:16px;cursor:pointer;padding:8px;flex:none}
@media (prefers-color-scheme:dark){.rv button{color:var(--sun)}}

.mine{display:grid;gap:14px;margin-block:12px 28px}
.mrow{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px;align-items:center}
.mrow .ph{border-radius:12px}
.mrow .title{font-size:18px}
.mrow .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow .acts .btn.danger{grid-column:1/-1}
.pill{display:inline-block;font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-top:4px}
.pill.sold{background:var(--warn-soft);color:var(--warn)}

.scrim{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--bg)}
.gallery>*{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/3;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover}
.sbody{padding:18px 18px 0;display:grid;gap:18px}
.closer{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px;margin-bottom:-64px;z-index:2;pointer-events:none}
.closer button{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#14203a;font-size:26px;cursor:pointer;box-shadow:var(--shadow)}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin:0}
.specs div{background:var(--surface);padding:12px 14px;display:grid}
.specs dt{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.specs dd{margin:0;font-weight:700;font-size:17.5px}
.seller{background:var(--bg);border-radius:16px;padding:16px;display:grid;gap:12px}
.seller strong{font-size:18px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact .btn.wa{grid-column:1/-1}
.phone code{font:800 21px/1 var(--body);font-variant-numeric:tabular-nums;user-select:all}
.desc{white-space:pre-wrap;margin:0;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:30;font-size:16px;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brandrow">
      <img class="logo" src="icon-192.png" alt="">
      <div class="grow"><h1>Car Bond</h1><p>Buy and sell cars in Uganda</p></div>
      <button class="install" id="installBtn" hidden>Install app</button>
    </div>
    <label class="search" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search Harrier, Premio, Ntinda…" aria-label="Search cars">
    </label>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 16v-3l2-5h10l4 5h2v3"/><circle cx="7.5" cy="16.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/></svg>Browse</button>
  <button data-tab="sell"><span class="plus"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></span>Sell</button>
  <button data-tab="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>My cars</button>
  <button data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Saved</button>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
